name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发入口：GitHub Actions push 事件偶发丢失（2026-08 基础设施故障）时，
  # 可用 `gh workflow run ci.yml --ref main` 手动触发。
  workflow_dispatch:

jobs:
  pr-traceability:
    name: PR 关联 Issue 门禁
    # 仅对 pull_request 事件生效：push 到 main 时没有 PR 上下文，无从校验 issue 引用
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require linked issue for pull requests
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          # 自动化依赖升级 bot（dependabot）按其作者身份豁免：其正文是上游
          # changelog 的转述，是否恰好含 `#123` 纯属偶然（见脚本头部说明）。
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node .github/scripts/check-pr-issue.mjs

  quality:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Install dependencies
        env:
          # node-gyp 编译原生模块（如 node-pty）时需下载 Node headers，
          # 偶发网络超时会中断整个 CI，这里加大 fetch 重试与退避参数
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "60000"
        run: pnpm install --frozen-lockfile

      # 附图模块的真机用例依赖系统 graphviz：缺它时那几条会整组 skip，而日志读起来
      # 仍然是绿的（「跳过」被误当成「通过」）。装上依赖，CI 守卫
      # （tests/patent/figuregen/external-dependency-signal.spec.ts）才有意义——
      # 依赖不可用时它会红，而不是让整条链路长期无信号。
      - name: Install graphviz (real-render figure tests)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # 议题/PR 工具链与标签门禁的负控制测试。整体挂载（而非逐个单文件）：
      # 新增脚本测试文件会自动进 CI，不再出现「测试写了但从不执行」。
      # 必须排在 install 之后 —— measure-techdebt.test.mjs 依赖 typescript。
      - name: Self-test PR tooling gates
        run: pnpm test:pr-tooling

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck (ui)
        working-directory: ui
        run: pnpm typecheck

      - name: Lint (root)
        run: pnpm lint

      - name: Lint (ui)
        working-directory: ui
        run: pnpm lint

      - name: Format check (Biome)
        run: pnpm format:check

      - name: Build & test (backend)
        run: pnpm test

      - name: Test (ui)
        working-directory: ui
        run: pnpm test

  # 降级候选漂移（informational）：扫描「新增外部/软依赖未登记 registry」，产出报告 artifact。
  # continue-on-error：漂移红叉可见但**不阻塞合并**（不进 required checks）；连续 4 次 CI 运行
  # 零新增（约 2 周）后转硬门禁（摘 continue-on-error + 加 required + 换 --check；转换时刻
  # 记录于 PR）。处理流程与退出判据见 docs/degradation-runbook.md。
  degradation-candidates:
    name: 降级候选漂移（informational）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Install dependencies
        env:
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "60000"
        # 仅需纯 JS 依赖（yaml），跳过 native 构建与 postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 扫描降级候选漂移
        run: pnpm gen:degradation-candidates --report degradation-candidates.md

      - name: 上传候选报告 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: degradation-candidates-report
          path: degradation-candidates.md
          if-no-files-found: error

      - name: 摘要与告警注解
        if: always()
        run: |
          LINE=$(grep -m1 '^gen-degradation-candidates:' degradation-candidates.md 2>/dev/null || true)
          if [ -z "$LINE" ]; then
            echo "::warning title=降级候选扫描::报告缺失（见扫描步骤日志）"
          elif echo "$LINE" | grep -q '新增候选 0 '; then
            echo "::notice title=降级候选扫描::$LINE"
          else
            echo "::warning title=降级候选漂移::$LINE——按 docs/degradation-runbook.md 处理"
          fi

  desktop:
    name: Desktop (Windows) build & lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable
        shell: bash

      - name: Install dependencies
        shell: bash
        env:
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "60000"
        # --ignore-scripts: 本 job 只需 tsc + eslint，无需编译 native 模块
        # （与 build-win.bat 的 pnpm install --ignore-scripts 一致；native 依赖
        # 由发版脚本单独重建）。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint (desktop)
        run: pnpm exec eslint apps/desktop
        shell: bash

      - name: Build (desktop TypeScript)
        working-directory: apps/desktop
        run: pnpm build
        shell: bash
