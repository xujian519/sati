name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发入口：GitHub Actions push 事件偶发丢失（2026-08 基础设施故障）时，
  # 可用 `gh workflow run ci.yml --ref main` 手动触发。
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Install dependencies
        env:
          # node-gyp 编译原生模块（如 node-pty）时需下载 Node headers，
          # 偶发网络超时会中断整个 CI，这里加大 fetch 重试与退避参数
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "60000"
        run: pnpm install --frozen-lockfile

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck (ui)
        working-directory: ui
        run: pnpm typecheck

      - name: Lint (root)
        run: pnpm lint

      - name: Lint (ui)
        working-directory: ui
        run: pnpm lint

      - name: Format check (Biome)
        run: pnpm format:check

      - name: Build & test (backend)
        run: pnpm test

      - name: Test (ui)
        working-directory: ui
        run: pnpm test
