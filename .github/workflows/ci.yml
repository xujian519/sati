name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发入口：GitHub Actions push 事件偶发丢失（2026-08 基础设施故障）时，
  # 可用 `gh workflow run ci.yml --ref main` 手动触发。
  workflow_dispatch:

jobs:
  pr-traceability:
    name: PR 关联 Issue 门禁
    # 仅对 pull_request 事件生效：push 到 main 时没有 PR 上下文，无从校验 issue 引用
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require linked issue for pull requests
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node .github/scripts/check-pr-issue.mjs

  quality:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Self-test PR traceability gate
        run: node --test .github/scripts/check-pr-issue.test.mjs

      - name: Install dependencies
        env:
          # node-gyp 编译原生模块（如 node-pty）时需下载 Node headers，
          # 偶发网络超时会中断整个 CI，这里加大 fetch 重试与退避参数
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "60000"
        run: pnpm install --frozen-lockfile

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck (ui)
        working-directory: ui
        run: pnpm typecheck

      - name: Lint (root)
        run: pnpm lint

      - name: Lint (ui)
        working-directory: ui
        run: pnpm lint

      - name: Format check (Biome)
        run: pnpm format:check

      - name: Build & test (backend)
        run: pnpm test

      - name: Test (ui)
        working-directory: ui
        run: pnpm test

  desktop:
    name: Desktop (Windows) build & lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable
        shell: bash

      - name: Install dependencies
        shell: bash
        env:
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "60000"
        # --ignore-scripts: 本 job 只需 tsc + eslint，无需编译 native 模块
        # （与 build-win.bat 的 pnpm install --ignore-scripts 一致；native 依赖
        # 由发版脚本单独重建）。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint (desktop)
        run: pnpm exec eslint apps/desktop
        shell: bash

      - name: Build (desktop TypeScript)
        working-directory: apps/desktop
        run: pnpm build
        shell: bash
