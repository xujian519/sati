name: Issue Triage

# 把 issue 模板里的人工勾选（「影响 scope」节）翻译成机器可筛选的 scope:* 标签，
# 并给没有任何 status:* 的议题补 status: triage，使新议题默认落在待分诊队列。
#
# 只增不减：语义分诊（确认、定级、派发）仍由人做，本 workflow 不替人决策。
# 标签白名单来自 .github/labels.yml；若报 "label not found"，说明清单已变更但
# 尚未同步——本地跑 `node scripts/sync-labels.mjs` 即可。

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  classify:
    name: 自动分类 issue
    # 只治理在办议题。已关闭议题是终态：编辑它（例如按关闭纪律补一句结论）不应
    # 被重新补上 status: triage。
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      # classify-issue.mjs 依赖根依赖 `yaml` 解析 .github/labels.yml；
      # 跳过 postinstall 脚本即可满足（纯 JS 依赖，无需编译 native 模块）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 逐行读标签并逐个 --add-label：标签名合法地包含空格（`status: triage`），
      # 任何"拼成分隔串再传给 gh"的写法都会把它拆坏（2026-09-14 的 'status:' not found）。
      - name: Classify and apply labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          added=0
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            gh issue edit "$ISSUE_NUMBER" --add-label "$label"
            added=$((added + 1))
          done < <(node scripts/classify-issue.mjs)
          echo "已新增 $added 个标签"
