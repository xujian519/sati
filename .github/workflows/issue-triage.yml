name: Issue Triage

# 把 issue 模板里的人工勾选（「影响 scope」与「严重级」两节）翻译成机器可筛选的
# scope:* / priority:* 标签，并给没有任何 status:* 的议题补 status: triage，
# 使新议题默认落在待分诊队列。
#
# 只增不减（相对正文推导）：语义分诊（确认、派发）仍由人做，本 workflow 不替人决策；
# 「严重级」勾选只把"定级"这一维变成有兜底的，不替人判断该定哪一级。
#
# ⚠️ `scope:*` 与「严重级」推出的 `priority:*` 都是正文的**投影**，每次运行都重新推导——
# 只摘标签而不改正文，下一次编辑（`edited`）会把它加回来；撤销一个误打的标签，正确动作是
# **取消正文勾选**。`priority:*` 只在正文确有勾选时才被重推（bug / feature / doc 议题与
# 未定级的债务议题仍是「摘掉即生效」）；正文多选时取最严重的一档，已有 `priority:*` 时
# 不加第二个（分诊结论优先）。详见 `docs/issue-management.md` §5。
#
# 标签白名单来自 .github/labels.yml；若报 "label not found"，说明清单已变更但
# 尚未同步——本地跑 `node scripts/sync-labels.mjs` 即可。

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  classify:
    name: 自动分类 issue
    # 只治理在办议题。已关闭议题是终态：编辑它（例如按关闭纪律补一句结论）不应
    # 被重新补上 status: triage。
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      # classify-issue.mjs 依赖根依赖 `yaml` 解析 .github/labels.yml；
      # 跳过 postinstall 脚本即可满足（纯 JS 依赖，无需编译 native 模块）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 逐行读标签并逐个 --add-label：标签名合法地包含空格（`status: triage`），
      # 任何"拼成分隔串再传给 gh"的写法都会把它拆坏（2026-09-14 的 'status:' not found）。
      - name: Classify and apply labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          added=0
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            gh issue edit "$ISSUE_NUMBER" --add-label "$label"
            added=$((added + 1))
          done < <(node scripts/classify-issue.mjs)
          echo "已新增 $added 个标签"
