packages:
  - 'ui'
  - 'apps/desktop'
  - 'src/context/memory/edgeclaw-memory-core'

allowBuilds:
  '@google/genai': true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Native/build-time packages that are allowed to run lifecycle scripts during
# pnpm install. Keeping this at the workspace root makes CI installs
# deterministic and prevents ERR_PNPM_IGNORED_BUILDS failures.
onlyBuiltDependencies:
  - '@google/genai'
  - bcrypt
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - node-pty
  - nuo-patent
  - protobufjs
  - sharp
  - unrs-resolver
