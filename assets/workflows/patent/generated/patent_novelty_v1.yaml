# 由 scripts/gen-patent-workflow-docs.ts 从 src/patent/workflow/manifests.ts 生成——请勿手改。
# 引擎执行真相：builtinPatentManifests（TS 单一数据源）；本文件为审计/人读快照。
# 修改流程：编辑 manifests.ts → pnpm gen:patent-workflow-docs → 提交两处。
manifestId: patent_novelty_v1
name: 专利新颖性分析
caseType: novelty_search
checkDomains:
  - patent_novelty
validation:
  requireAllSteps: true
  maxRetries: 2
stages:
  - id: parse
    strategy: chain
    atom: extract
    description: 解析技术交底书，提取技术特征
  - id: generate_keywords
    strategy: chain
    atom: keywords
    description: 生成检索关键词（上位/下位/同义词）
  - id: search
    strategy: react
    atom: search
    worker: patent-search-commander
    description: 检索现有技术文献
  - id: compare
    strategy: chain
    atom: novelty
    description: 逐项对比技术特征与现有技术（单独对比原则）
  - id: conclude
    strategy: chain
    description: 生成新颖性分析结论（附置信度）（收口模式：graph 侧同为自定义 LLM 节点，非 atom handler）
  - id: approval
    strategy: chain
    atom: approval-gate
    description: 人工确认分析结论

