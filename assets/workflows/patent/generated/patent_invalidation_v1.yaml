# 由 scripts/gen-patent-workflow-docs.ts 从 src/patent/workflow/manifests.ts 生成——请勿手改。
# 引擎执行真相：builtinPatentManifests（TS 单一数据源）；本文件为审计/人读快照。
# 修改流程：编辑 manifests.ts → pnpm gen:patent-workflow-docs → 提交两处。
manifestId: patent_invalidation_v1
name: 无效/复审答复
caseType: invalidation_analysis
checkDomains:
  - patent_invalidation
  - patent_novelty
  - patent_inventiveness
validation:
  requireAllSteps: true
  maxRetries: 2
stages:
  - id: dispute_framing
    strategy: chain
    description: "粗定争议范围：先列争议法条/理由与涉及权项，供 parse 过滤（先定争点再解析，避免无关事实展开）。按两段输出：## dispute_grounds（争议法条/理由，每行一条）与 ## dispute_claims（涉及权项，每行一条）。两段都识别不到时段落留空，并写明「未识别争点」——不得写成「无争点」。"
  - id: parse
    strategy: chain
    description: 解析无效请求/驳回决定与权利要求（消费 dispute_framing 过滤；未识别争点时按全文解析并注明「未识别争点」）
  - id: claim-chart
    strategy: chain
    atom: claim-chart
    description: 权利要求要素级映射到证据组合（mode=invalidity/reexamination）
  - id: novelty
    strategy: chain
    description: 新颖性单独对比（单篇全覆盖）（原子路径不支持，收口模式）
  - id: inventiveness
    strategy: chain
    description: 三步法创造性分析（原子路径不支持，收口模式）
  - id: approval
    strategy: chain
    description: 人工确认分析结论

