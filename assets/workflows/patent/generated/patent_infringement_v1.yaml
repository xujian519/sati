# 由 scripts/gen-patent-workflow-docs.ts 从 src/patent/workflow/manifests.ts 生成——请勿手改。
# 引擎执行真相：builtinPatentManifests（TS 单一数据源）；本文件为审计/人读快照。
# 修改流程：编辑 manifests.ts → pnpm gen:patent-workflow-docs → 提交两处。
manifestId: patent_infringement_v1
name: 侵权比对分析
caseType: infringement_analysis
checkDomains:
  - patent_infringement
validation:
  requireAllSteps: true
  maxRetries: 2
stages:
  - id: parse
    strategy: chain
    description: 解析权利要求与被控产品材料
  - id: claim-chart
    strategy: chain
    atom: claim-chart
    description: 权利要求要素级映射到被控产品（mode=infringement，支持等同 doe 行）
  - id: report
    strategy: chain
    description: 生成侵权比对报告（全面覆盖 + 等同 + 现有技术抗辩）
  - id: approval
    strategy: chain
    description: 人工确认比对结论

