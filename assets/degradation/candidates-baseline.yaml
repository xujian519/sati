# candidates-baseline.yaml — 降级候选扫描的「已确认项」基线
#
# 用途：scripts/gen-degradation-candidates.mjs 的差集对象之一。扫描命中文件 =
#   registry 覆盖 + 本基线（已确认项）+ 新增候选。
#   - known-unregistered：已知未登记——真外部/软依赖触点，属登记候选队列
#     （后续批次按 T5 模式深挖补登记；不阻塞扫描转硬门禁）；
#   - waived：书面豁免——模式误报（注释/类型/自命中）、同族语义覆盖（wrapper /
#     实现本体 / 登记行调用位置）、dev/CI 工具链（非产品降级面）。
#
# 纪律（与 registry「冗余豁免即红」同精神）：
#   1. 新增候选必须三选一后清零：补 registry 登记 / 记入本基线（写清依据）/ 修扫描模式；
#   2. 基线条目失效（不再命中）或冗余（已被 registry 覆盖）会被报告为「失效/冗余基线」，
#      --check 下失败——豁免是「暂时没有」的书面承认，不是永久标签；
#   3. 文件级精确匹配，不支持目录/glob 豁免（防止整树静默）；
#   4. 处理流程与退出判据见 docs/degradation-runbook.md。
#
# 首次生成：T6（2026-10-10）——对扫描差集 72 项 100% 分类（waived 28 / known-unregistered 44）。
