# 降级语义 registry —— fail-open / fail-closed 立规的唯一事实源。
#
# 每条 = 一个外部/软依赖的降级行为单元，五要素：
#   component（代码位置）/ dependency / failDirection / degradedBehavior / degradedImpact
#   + observability（可观测足迹，铁律 11）/ negativeDrill（负向演练测试）
#
# 门禁：scripts/check-degradation-registry.mjs（挂 pnpm lint）硬校验路径存在、枚举合法、
# 豁免理由必填、禁止冗余豁免。schema 见 degradation.schema.json（文档用途）。
# 立规背景：docs/degradation-registry-plan.md；对账基线：docs/degradation-baseline-inventory.md。
#
# 手工编辑规则：新增外部依赖必须登记；豁免必须给 reason；observability 为空即须豁免。
#
# T2 存量登记（2026-10-10）：按 baseline-inventory 全量对账录入 46 条。
#   - mixed 类按子语义拆分：router（pre-content open / post-content closed）、
#     schema 版本（真源 closed / 派生 open）、patent_search（网络错 closed / 零结果 open）、
#     patent_metadata（not-found open / 网络错 closed）、team 转派（重试 open / 迟到写 closed）。
#   - 静默豁免（intentional_silence）：D2 spill（T3b 修复后解除）、task-resume（T3a 解除）、
#     token-stats（T3b 解除）、edgeclaw inner（T3c 永久）、ollama probe（现状无日志，永久）。
#   - 演练豁免（drill_missing）：provider-health / web-fetch / agent-input-flush（T4 补）、
#     scripts smoke（无独立 spec，T5 评估）。
version: 1
entries:
  # ---------- 模型 / 路由 ----------
  - id: router-fallback-pre-content
    component: src/router/fallback/runFallbackChain.ts
    dependency: "模型路由 fallback 链（跨 provider/model）——执行前段"
    failDirection: open
    degradedBehavior: "逐 attempt 换 fallback 目标（zero-usage retry 门控）；吐出内容前可整链重试"
    degradedImpact: "换用降级模型时质量/成本变化；用户经重试与 fallback 事件可见"
    observability: "fallbackTier / 重试事件打点"
    negativeDrill: tests/router/fallback/runFallbackChain.spec.ts

  - id: router-post-content-truncation
    component: src/router/execution/executeRouterDecision.ts
    dependency: "模型路由执行层——已产出内容段"
    failDirection: closed
    degradedBehavior: "一旦吐出内容事件即不再 fallback：遇错截断并统一上报（:58 关键不变量）"
    degradedImpact: "已产出内容可能停在残片；用户见错误事件"
    observability: "错误事件 + 截断上报"
    negativeDrill: tests/router/router-runtime-execute.spec.ts

  - id: provider-health-tracker
    component: src/router/health/ProviderHealthTracker.ts
    dependency: "Provider 健康熔断器（内存态状态机）"
    failDirection: open
    degradedBehavior: "healthy→degraded→open→half_open；连续失败降级候选，熔断期该 provider 不参与路由"
    degradedImpact: "熔断期候选集缩小；无用户直接感知（fallbackTier 事件间接可见）"
    observability: "状态机自身无日志；路由侧 fallbackTier 事件间接可见"
    waiver:
      - kind: drill_missing
        reason: "状态机无独立 spec——T4 补（openDurationMs: 0 构造 half_open + 迁移断言）"

  - id: router-zero-usage-retry
    component: src/router/retry/retryGates.ts
    dependency: "零用量重试门控"
    failDirection: open
    degradedBehavior: "无产出内容时可重试；有产出不重试（避免重复文本）"
    degradedImpact: "重试增加时延；无内容损失"
    observability: "重试事件"
    negativeDrill: tests/router/retry/zeroUsageRetry.spec.ts

  - id: token-saver-judge-fallback
    component: src/router/tokenSaver/classifyAndRoute.ts
    dependency: "tokenSaver 判官（judge LLM）"
    failDirection: open
    degradedBehavior: "judge 失败 / 输入超 40K → 降级默认 tier（resolvedFrom: fallback）"
    degradedImpact: "该轮无 tokenSaver 节省，按默认 tier 计费"
    observability: "resolvedFrom 标记"
    negativeDrill: tests/router/router-runtime-token-saver-failure.spec.ts

  - id: multimodal-reroute
    component: src/router/media/rerouteDecisionForMedia.ts
    dependency: "多模态重路由（媒体升级链）"
    failDirection: open
    degradedBehavior: "模型不支持图/PDF/音频 → 换支持候选重发（不参与故障降级链）；无候选 → 明确报错"
    degradedImpact: "无候选时模型收到 unsupported_modality 错误，不静默丢媒体"
    observability: "结构化错误 ModelRequestError"
    negativeDrill: tests/router/utils/mediaReroute.spec.ts

  - id: ollama-probe-degrade
    component: src/model/ollama/probe.ts
    dependency: "Ollama 模型探测（本地推理服务）"
    failDirection: open
    degradedBehavior: "探测失败按『未安装可识别模型』处理（返回 null / 缓存列表）；warm 路径 fire-and-forget"
    degradedImpact: "Ollama 模型列表可能缺失（至下次探测成功）；用户选择器可见"
    observability: ""
    waiver:
      - kind: intentional_silence
        reason: "现状无日志（探测失败=未安装的语义写在代码注释；.catch(() => {}) 防 unhandledRejection）。永久豁免，T6 复核是否补 debug 日志"
    negativeDrill: tests/model/ollamaProbe.spec.ts

  - id: embedding-resolve-degrade
    component: src/model/embedding/resolve.ts
    dependency: "Embedding 客户端（memory.embedding 可选增强）"
    failDirection: open
    degradedBehavior: "配置错误（未知 provider/缺端点）→ 返回 undefined + warning 诊断（recoverable: true）"
    degradedImpact: "失去语义召回；关键词路径原样工作"
    observability: "warning 诊断（recoverable）"
    negativeDrill: tests/model/embedding/resolve.spec.ts

  - id: model-provider-error
    component: src/model/providers/openai-responses/stream.ts
    dependency: "模型 provider（anthropic/google/openai/openai-responses）原始错误"
    failDirection: closed
    degradedBehavior: "统一包装 ModelProviderError 上抛，由 router fallback/retry 接管"
    degradedImpact: "错误原样上报；是否降级由路由层决定"
    observability: "结构化错误 ModelProviderError"
    negativeDrill: tests/model/streaming/streamModelRetry.spec.ts

