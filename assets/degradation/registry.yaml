# 降级语义 registry —— fail-open / fail-closed 立规的唯一事实源。
#
# 每条 = 一个外部/软依赖的降级行为单元，五要素：
#   component（代码位置）/ dependency / failDirection / degradedBehavior / degradedImpact
#   + observability（可观测足迹，铁律 11）/ negativeDrill（负向演练测试）
#
# 门禁：scripts/check-degradation-registry.mjs（挂 pnpm lint）硬校验路径存在、枚举合法、
# 豁免理由必填、禁止冗余豁免。schema 见 degradation.schema.json（文档用途）。
# 立规背景：docs/degradation-registry-plan.md；对账基线：docs/degradation-baseline-inventory.md。
#
# 手工编辑规则：新增外部依赖必须登记；豁免必须给 reason；observability 为空即须豁免。
#
# T2 存量登记（2026-10-10）：按 baseline-inventory 全量对账录入 46 条。
#   - mixed 类按子语义拆分：router（pre-content open / post-content closed）、
#     schema 版本（真源 closed / 派生 open）、patent_search（网络错 closed / 零结果 open）、
#     patent_metadata（not-found open / 网络错 closed）、team 转派（重试 open / 迟到写 closed）。
# T5 深挖补登记（2026-10-10）：+15 条（46→61）——ego 浏览器 / gateway 服务端 WS（握手 + 断连清理）/
#   edgeclaw 子包（HTTP 重试、解析 fallback、heartbeat 隔离、维护调度）/ session 检索（标题、历史搜索）/
#   ui relay 重连 / scripts 触网脚本 ×5。负向发现：measure-assembly-stability 等两脚本不触网，无需登记。
#
# 豁免总览（2026-10-10）：
#   - 静默豁免 ×5：edgeclaw inner（T3c 永久）、ollama probe（永久）；T5 新发现 3 处——
#     gateway 断连 abort 吞错、edgeclaw 解析 fallback（生产未注入 logger）、searchChatHistory 目录不可读
#     ——均已登记，候选后续专项修复。
#   - 演练豁免 ×11：scripts/工具类与深内部路径（理由见各条目）；spill / task-resume / token-stats /
#     provider-health / web-fetch / agent-input-flush 曾为临时豁免，已于 T3/T4 修复并解除。
version: 1
entries:
  # ---------- 模型 / 路由 ----------
  - id: router-fallback-pre-content
    component: src/router/fallback/runFallbackChain.ts
    dependency: "模型路由 fallback 链（跨 provider/model）——执行前段"
    failDirection: open
    degradedBehavior: "逐 attempt 换 fallback 目标（zero-usage retry 门控）；吐出内容前可整链重试"
    degradedImpact: "换用降级模型时质量/成本变化；用户经重试与 fallback 事件可见"
    observability: "fallbackTier / 重试事件打点"
    negativeDrill: tests/router/fallback/runFallbackChain.spec.ts

  - id: router-post-content-truncation
    component: src/router/execution/executeRouterDecision.ts
    dependency: "模型路由执行层——已产出内容段"
    failDirection: closed
    degradedBehavior: "一旦吐出内容事件即不再 fallback：遇错截断并统一上报（:58 关键不变量）"
    degradedImpact: "已产出内容可能停在残片；用户见错误事件"
    observability: "错误事件 + 截断上报"
    negativeDrill: tests/router/router-runtime-execute.spec.ts

  - id: provider-health-tracker
    component: src/router/health/ProviderHealthTracker.ts
    dependency: "Provider 健康熔断器（内存态状态机）"
    failDirection: open
    degradedBehavior: "healthy→degraded→open→half_open；连续失败降级候选，熔断期该 provider 不参与路由"
    degradedImpact: "熔断期候选集缩小；无用户直接感知（fallbackTier 事件间接可见）"
    observability: "状态机自身无日志；路由侧 fallbackTier 事件间接可见"
    negativeDrill: tests/router/health/provider-health-tracker.spec.ts

  - id: router-zero-usage-retry
    component: src/router/retry/retryGates.ts
    dependency: "零用量重试门控"
    failDirection: open
    degradedBehavior: "无产出内容时可重试；有产出不重试（避免重复文本）"
    degradedImpact: "重试增加时延；无内容损失"
    observability: "重试事件"
    negativeDrill: tests/router/retry/zeroUsageRetry.spec.ts

  - id: token-saver-judge-fallback
