    failDirection: open
    degradedBehavior: "模型不支持图/PDF/音频 → 换支持候选重发（不参与故障降级链）；无候选 → 明确报错"
    degradedImpact: "无候选时模型收到 unsupported_modality 错误，不静默丢媒体"
    observability: "结构化错误 ModelRequestError"
    negativeDrill: tests/router/utils/mediaReroute.spec.ts

  - id: ollama-probe-degrade
