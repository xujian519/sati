  domain: patent_infringement
  legal_basis: 《专利法》第五十九条第二款；《侵犯专利权司法解释（一）》第八条；侵权判定指南第74-75条
  fix_suggestion: 外观设计侵权判定包括两个层面：产品种类层面（是否相同或相近）和外观设计层面（是否相同或相近）。比对应以专利公告图片或照片为基准，而非专利产品实物。
  check:
    type: patent_infringement
    mode: both
    requiredElements: []
    required_elements: []
    message: 外观设计侵权判定的前提是产品种类相同或相近，且采用的外观设计相同或相近似。侵权比对应以专利公告中的图片或照片为准（'虚'），而非以专利产品实物为准（'实'）。
- id: INF-DES-002
  name: 外观设计侵权：整体观察、综合判断
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《专利法》第五十九条第二款；《侵犯专利权司法解释（一）》第八条、第十一条；侵权判定指南第76-80条
  fix_suggestion: 外观设计侵权判定采用'整体观察、综合判断'方法。判断步骤：(1)总结异同点；(2)逐一判断对整体视觉效果影响程度；(3)回归整体观察、综合判断。以'相同或相近似'为标准，而非'混淆、误认'。
  check:
    type: patent_infringement
    mode: both
    requiredElements: []
    required_elements: []
    message: 外观设计侵权判定的核心方法是'整体观察、综合判断'，即对授权外观设计和被诉侵权设计可视部分的全部设计特征进行逐个分析比对后，综合考虑所有影响整体视觉效果的因素作出判断。
