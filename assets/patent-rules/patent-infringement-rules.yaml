# 专利侵权判定规则集
# 来源：北京高级人民法院《专利侵权判定指南（2017）理解与适用》
# 涵盖：权利保护范围、侵权判定、间接侵权、侵权抗辩、外观设计侵权
# 规则总数：48

rules:
- id: INF-SCOPE-001
  name: 以权利要求为准原则
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《专利法》第五十九条第一款；《侵犯专利权司法解释（一）》第1条；侵权判定指南第5条
  fix_suggestion: 在起诉状中明确载明具体的权利要求，并对该权利要求进行技术特征划分。保护范围应基于权利要求记载的全部技术特征，包括等同特征。
  check:
    type: structural_analysis
    requiresAll: &id001
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id001
    message: 专利权保护范围应当以权利要求记载的技术特征所确定的内容为准，也包括与所记载的技术特征相等同的技术特征所确定的内容。
- id: INF-SCOPE-002
  name: 权利要求的选择权
  severity: critical
  action: warn
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《侵犯专利权司法解释（二）》第1条；侵权判定指南第6条
  fix_suggestion: 在起诉状中明确载明主张的权利要求项数。如果起诉时未明确，应在法院释明后立即明确，避免诉讼风险。
  check:
    type: keyword_blocklist
    keywords: []
    absoluteBan: &id002 []
    absolute_ban: *id002
    message: 权利人应当在起诉状中载明具体的权利要求。起诉状对此未记载或者记载不明的，应当要求权利人明确；经释明，权利人在一审法庭辩论终结前不予明确的，可以裁定驳回起诉。
- id: INF-SCOPE-003
  name: 最终有效文本为准
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《专利法》第五十九条；侵权判定指南第11条
  fix_suggestion: 以最终有效的权利要求文本作为侵权判定的依据。如有多个生效法律文书，以最后的生效法律文书确定的专利文本为准。
  check:
    type: structural_analysis
    requiresAll: &id003
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id003
    message: 确定专利权的保护范围时，应当以国务院专利行政部门公告授权的专利文本或者已经发生法律效力的无效宣告请求审查决定及相关的确权行政判决所确定的权利要求为准。
- id: INF-SCOPE-004
  name: 整体技术方案理解
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《专利法》第五十九条；侵权判定指南第14条
  fix_suggestion: 理解权利要求时，必须将所有技术特征作为一个整体来考量，不得孤立解读单个技术特征或割裂技术特征之间的联系。
  check:
    type: structural_analysis
    requiresAll: &id004
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id004
    message: 在确定专利权保护范围时，应当考虑权利要求中记载的全部技术特征，将权利要求中记载的全部技术特征所表达的技术内容作为一个整体技术方案加以考虑。
- id: INF-SCOPE-005
  name: 内部证据优先规则
  severity: warning
  action: log
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《侵犯专利权司法解释（一）》第3条；侵权判定指南第15条
  fix_suggestion: 首先根据权利要求本身和说明书内部证据解释术语含义。只有在内部证据确实无法明确理解时，才引入外部证据辅助解释。
  check:
    type: structural_analysis
    requiresAll: &id005
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id005
    message: 解释权利要求应当优先参考内部证据（权利要求、说明书、附图、审查档案等），只有在内部证据无法明确理解时才考虑外部证据（工具书、教科书、专家证言等）。
- id: INF-SCOPE-006
  name: 澄清、弥补和特定情况下的修正
  severity: warning
  action: log
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 侵权判定指南第13条
  fix_suggestion: 如果权利要求中存在明显且能够明确更正的错误，应以更正后的技术内容确定保护范围。更正不应影响权利要求保护边界的确定性和公示性。
  check:
    type: structural_analysis
    requiresAll: &id006
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id006
    message: 对于权利要求中的明显错误，本领域普通技术人员在阅读权利要求、说明书及附图后能够明确无误地立即发现并得出更正答案的，应当以更正后的权利要求来确定保护范围。
- id: INF-SCOPE-007
  name: 功能性限定特征的解释
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《侵犯专利权司法解释（二）》第8条；侵权判定指南第18-19条
  fix_suggestion: 对于功能性特征，必须结合说明书中的具体实施方式进行解释。不能仅根据功能用语无限扩大保护范围，应限于实现该功能所必需的结构、步骤特征。
  check:
    type: structural_analysis
    requiresAll: &id007
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id007
    message: 功能性特征应当结合说明书及附图描述的该功能或者效果的具体实施方式及其等同的实施方式确定其内容，并限定为实现所述功能、效果不可缺少的结构、步骤特征。
- id: INF-SCOPE-008
  name: 禁止反悔原则
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《侵犯专利权司法解释（一）》第6条；《侵犯专利权司法解释（二）》第13条
  fix_suggestion: 在侵权程序中主张等同侵权时，必须核查专利审查历史。如果被主张等同的技术方案在审查或无效程序中已被放弃，则不得主张等同侵权。
  check:
    type: structural_analysis
    requiresAll: &id008
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id008
    message: 专利权人在专利授权或无效程序中通过修改或意见陈述放弃的技术方案，在侵权程序中不得再通过等同原则将其纳入保护范围。
- id: INF-DET-001
  name: 全面覆盖原则
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《专利法》第五十九条第一款；《侵犯专利权司法解释（一）》第7条；侵权判定指南第35条
  fix_suggestion: 在侵权比对时，必须逐一对比权利要求中的每个技术特征。如果被诉侵权技术方案缺少任何一个技术特征，或某个技术特征不相同也不等同，则不构成侵权。
  check:
    type: patent_infringement
    mode: both
    requiredElements: []
    required_elements: []
    message: 全面覆盖原则是专利侵权判定的基本原则。被诉侵权技术方案必须包含权利要求记载的全部技术特征（相同或等同），才构成侵权。缺少任一技术特征则不构成侵权。
- id: INF-DET-002
  name: 专利产品在侵权比对中的地位
  severity: warning
  action: log
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 侵权判定指南第36条
  fix_suggestion: 侵权比对必须以权利要求的技术方案为依据，而非专利产品实物。专利产品可用于辅助理解技术特征，但不能作为比对基准。
  check:
    type: structural_analysis
    requiresAll: &id009
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id009
    message: 不应以专利产品与被诉侵权技术方案直接进行比对。专利产品仅可作为理解技术特征的辅助，侵权比对的对象是被诉侵权技术方案与权利要求的技术方案。
- id: INF-DET-003
  name: 双方专利产品不是侵权对比的对象
  severity: critical
  action: warn
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 侵权判定指南第37条
  fix_suggestion: 当被诉侵权人主张实施自有专利时，仍需将其技术方案与原告专利权利要求进行比对。如果自有专利从属于原告专利或构成重复授权，实施该专利仍构成侵权。
  check:
    type: structural_analysis
    requiresAll: &id010
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id010
    message: 双方均拥有专利权时，不能将双方专利产品或权利要求进行比对。仍应以被诉侵权技术方案与原告专利权利要求进行对比。实施自有专利并非法定抗辩事由。
- id: INF-DET-004
  name: 相同侵权的认定
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《专利法》第五十九条第一款；《侵犯专利权司法解释（一）》第7条；侵权判定指南第38条
  fix_suggestion: 判断相同侵权时，应将被诉侵权技术方案与权利要求进行逐一比对。如果被诉侵权方案包含权利要求的全部技术特征，则构成相同侵权。新增技术特征不影响侵权认定。
  check:
    type: patent_infringement
    mode: both
    requiredElements: []
    required_elements: []
    message: 相同侵权（字面侵权）是指被诉侵权技术方案包含了与权利要求记载的全部技术特征相同的对应技术特征。包括全部技术特征完全相同、下位概念侵权、新增技术特征的侵权三种情形。
- id: INF-DET-005
  name: 下位概念侵权
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 侵权判定指南第39条
  fix_suggestion: 在侵权比对时，识别权利要求中的上位概念。如果被诉侵权方案使用的是该上位概念的下位概念，则构成相同侵权。不能用说明书及附图中显示的具体结构来限定上位概念的技术特征。
  check:
    type: category_detection
    categories: []
    minCategories: 2
    min_categories: 2
    message: 当权利要求中记载的技术特征采用上位概念，而被诉侵权技术方案的相应技术特征采用下位概念的，应当认定构成相同技术特征，落入专利权保护范围。
- id: INF-DET-006
  name: 新增技术特征的侵权
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 侵权判定指南第40条
  fix_suggestion: 增加技术特征不影响侵权认定，只要被诉侵权方案包含了权利要求的全部技术特征。但需注意封闭式权利要求等特殊情形。如果缺少必要技术特征，即使效果变劣，也不构成侵权。
  check:
    type: structural_analysis
    requiresAll: &id011
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id011
    message: 被诉侵权技术方案在包含权利要求全部技术特征的基础上增加新的技术特征的，仍构成侵权。但专利文件明确排除该技术特征或属于封闭式权利要求的除外。缺少技术特征导致变劣的，不构成侵权。
- id: INF-DET-007
  name: 封闭式权利要求的侵权认定
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《侵犯专利权司法解释（二）》第8条；侵权判定指南第41条
  fix_suggestion: 识别封闭式权利要求的措辞（'由……组成'、'组成为'）。对于封闭式权利要求，新增技术特征一般不构成侵权，但需审查是否属于不可避免的常规数量杂质。
  check:
    type: keyword_blocklist
    keywords: []
    absoluteBan: &id012 []
    absolute_ban: *id012
    message: 封闭式权利要求采用'由……组成'等表达方式，保护范围较窄。被诉侵权技术方案在包含封闭式权利要求全部技术特征的基础上增加其他技术特征的，一般不构成侵权。
- id: INF-DET-008
  name: 功能性特征的侵权判断
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《侵犯专利权司法解释（二）》第8条；侵权判定指南第42条
  fix_suggestion: 功能性特征侵权判断必须结合说明书。首先确定被诉侵权方案是否实现了专利权利要求所述功能，然后比较实现该功能的具体结构或步骤。如果被诉侵权产品不具备该功能，则不构成侵权。
  check:
    type: patent_infringement
    mode: both
    requiredElements: []
    required_elements: []
    message: 对于包含功能性特征的权利要求，应将被诉侵权技术方案的相应结构、步骤特征与说明书中为实现所述功能、效果不可缺少的结构、步骤特征进行比较。功能性特征作为一个整体技术特征，不可进一步拆分。
- id: INF-DET-009
  name: 从属专利的认定
  severity: warning
  action: log
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《专利法》第五十一条；侵权判定指南第43条
  fix_suggestion: 判断是否为从属专利的核心是：在后专利是否记载了在先专利的全部技术特征并增加了新技术特征。实施从属专利需要获得在先专利权人的许可，否则构成对在先专利权的侵犯。
  check:
    type: structural_analysis
    requiresAll: &id013
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id013
    message: 从属专利是在先专利基础上增加了新技术特征的改进专利。实施从属专利仍落入在先专利的保护范围，应当经过在先专利权人的同意。
- id: INF-DET-010
  name: 等同侵权的依职权认定
  severity: warning
  action: warn
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《关于审理专利纠纷案件适用法律问题的若干规定》第17条；侵权判定指南第44条
  fix_suggestion: 法院在相同侵权不成立后，应主动审查是否构成等同侵权。即使权利人未明确提出等同侵权主张，法院也应进行释明，要求权利人举证或说明。
  check:
    type: structural_analysis
    requiresAll: &id014
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    - element: ''
      patterns: []
    requires_all: *id014
    message: 在相同侵权不成立的情况下，应当判断是否构成等同侵权。这是法院的职责所在，不受权利人的主张限制。权利人应当举证或进行充分说明。
- id: INF-DET-011
  name: 等同侵权及等同特征的认定
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 《关于审理专利纠纷案件适用法律问题的若干规定》第17条；《侵犯专利权司法解释（一）》第7条；侵权判定指南第44-47条
  fix_suggestion: 判断等同侵权需采用'三步法'：首先获取区别技术特征，然后判断'三个基本相同'（手段、功能、效果），最后判断本领域普通技术人员是否无需创造性劳动就能联想到。
  check:
    type: patent_infringement
    mode: both
    requiredElements: []
    required_elements: []
    message: 等同侵权是指被诉侵权技术方案有一个或一个以上技术特征与权利要求中的相应技术特征从字面上看不相同，但属于等同特征。等同特征的认定采用'三步法'：获取区别技术特征、判断'三个基本相同'（手段、功能、效果）、判断显而易见性。
- id: INF-DET-012
  name: 基本相同的手段
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 侵权判定指南第46条
  fix_suggestion: 在判断'基本相同的手段'时，应关注技术特征的技术内容，采用'无实质性差异'标准。注意区分技术特征层面的工作原理与整体方案层面的工作原理。
  check:
    type: pattern_analysis
    patterns: []
    antiPatterns: &id015 []
    anti_patterns: *id015
    message: 基本相同的手段是指被诉侵权技术方案中的技术特征与权利要求对应技术特征在技术内容上并无实质性差异。判断时应采用'无实质性差异'标准，针对技术特征层面而非整体方案层面。
- id: INF-DET-013
  name: 基本相同的功能
  severity: warning
  action: warn
  phases:
  - post_execution
  domain: patent_infringement
  legal_basis: 侵权判定指南第47条
  fix_suggestion: 判断功能是否基本相同时，只需关注与专利对应技术特征相同的功能。被诉侵权产品中该特征具有的额外功能不影响等同认定。
  check:
    type: pattern_analysis
    patterns: []
    antiPatterns: &id016 []
    anti_patterns: *id016
    message: 基本相同的功能是指被诉侵权技术方案中的技术特征与权利要求对应技术特征在各自技术方案中所起的作用基本相同。被诉侵权技术特征的其他作用不予考虑。
- id: INF-DET-014
  name: 等同侵权的时间标准
  severity: critical
  action: block
  phases:
  - post_execution
  domain: patent_infringement
