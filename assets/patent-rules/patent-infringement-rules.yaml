    message: 制造发明或者实用新型专利产品，是指权利要求中所记载的产品技术方案被实现。产品数量、质量不影响认定。以不同制造方法制造、将部件组装成专利产品的行为构成制造。外观设计专利制造是指图片或照片中的产品被实现。
