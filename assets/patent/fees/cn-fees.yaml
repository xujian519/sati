# 中国专利官费索引
#
# 本文件登记「有哪些费种、在哪个环节缴、按什么基准计数、能不能减缴」，以及每一个官费金额。
# 结构（哪些费种、几个、怎么计数）是**可核验的规则**；金额是从官方文书**抄录**来的内容，
# 所以每一项都带 sourceDoc / sourceUrl / publishedOn / verifiedOn / effectiveFrom。
#
# 抄录所据（逐条核对过，不是转抄二手）：
#   国家知识产权局《专利收费、集成电路布图设计收费标准》（即《专利和集成电路布图设计缴费
#   服务指南》附件2），2024-08-06 发布。
#   https://cponline.cnipa.gov.cn/GzfwYwblGlwhTMVC/GzfwYwblGlwhT/selectByNoticeId?weihuRid=286
#   该页同时列出收费依据：发改价格〔2017〕270号 附件2、财税〔2018〕37号、发改价格〔2022〕465号、
#   财税〔2024〕23号、发改价格〔2024〕1156号、财税〔2016〕78号、财税〔2019〕45号。
#   2026-10-15 复核：与 2025-12-29 修订发布的《缴费服务指南》所附「年费计算参考表」逐格一致，
#   国内部分无改动。
#
# 文书自身的发布日填 publishedOn；**逐条核对通过的日期**填 verifiedOn。没有 verifiedOn 的
# 金额是「未核验」，计价时按未核验处理（不给合计），不是默认已核验。
#
# 已知不覆盖（记录在此，不在条目里编造）：
#   - 集成电路布图设计收费：本索引只做专利。
#   - PCT 国际阶段费用（国际申请费、手续费、检索费、附加检索费、初步审查费、优先权文件费、
#     单一性异议费、副本复制费、后提交费）：国际申请费与手续费为代世界知识产权组织国际局收取，
#     以人民币计收的数额按 WIPO 每年公布的标准确定，随汇率调整，不是固定官费。
#   - 外观设计国际注册申请（海牙协定）的国际程序费用与指定中国的单独指定费：国际程序费用向
#     国际局缴纳，以瑞士法郎计。
#   - 印花税：细则第 110 条列举的费种里没有印花税（办登已无此费）。
#
# 语义（转录时按此读，不要另作解释）：
#   trigger       该费种在哪个环节产生，由查询的 triggers 选中。
#   patentTypes   适用对象；null 表示未限定（三种专利类型同价）。
#   basis         计数基准：per-case 每件；per-claim-beyond 超过 freeUnits 项后的每项；
#                 per-page-beyond 超过 freeUnits 页后的每页；per-priority 每项优先权要求；
#                 per-annuity-year 每个专利年度；per-month 每请求月数。
#   freeUnits     计数的免费基数（仅 beyond 类基准使用）。
#   amount        单价（元，字符串）；null 表示**未转录**，此时必须写 unpriceableReason——
#                 除非价格在 tiers 里（年费三档就是这种：顶层没有单价，不等于不可计价）。
#   reducible     是否属于费用减缴范围；null 表示未登记。「不予减缴」的官费按 false 记录。
#   reductionMaxYears  年费类条目减缴覆盖的最高专利年度（未给授权年度时的保守近似）。
#   tiers         年费分档（fromYear / toYear / amount）。
#   latePayment   滞纳金规则：monthlyPercent 为每超过缴费时间 1 个月加收当年全额年费的百分数；
#                 maxMonths 为法定的可补缴月数上限；tabulatedMonths 为官方参考表**已列出**的
#                 最高滞纳金月份数（超出它的月份不给金额，交人工核价）。
#   note          该费种特有的口径提示，随计价行带到报告里。
#
# 费用相同但按专利类型分档的费种拆成两个条目（申请费 / 复审费 / 无效宣告请求费各有一条
# -utility-design 兄弟条目），年费按三种类型各一条：条目只承载一个金额，拆条目而不是让金额
# 随类型漂移。

