  # ── 年费 ────────────────────────────────────────────────────────────────────
  #
  # 滞纳金：细则第 115 条给的是「自应当缴纳年费期满之日起 6 个月内补缴，同时缴纳滞纳金；
  # 滞纳金的金额按照每超过规定的缴费时间 1 个月，加收当年全额年费的 5% 计算」。
  # 但官方《年费计算参考表》逐格列出的滞纳金只到 **25%（5 个月）**，与 6 个月的窗口差一个月。
  # 这一个月的差额决定案子是「多缴」还是「缴费不足」，方向不同后果不同（后者丢权利），
  # 所以按 tabulatedMonths 划线：5 个月以内给金额，第 6 个月不给、交人工核价。
