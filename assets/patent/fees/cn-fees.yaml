# 本表是多份文书的现行合并结果（发改价格〔2017〕270号 附件2 为骨架，财税〔2018〕37号、
# 发改价格〔2022〕465号、财税〔2024〕23号、发改价格〔2024〕1156号 陆续改动若干子项），
# 没有一个日期对全表成立，故留 null；逐项的施行依据写在条目的 legalBasis / note 里。
effectiveFrom: null

# 费用减缴（《专利收费减缴办法》财税〔2016〕78号，经财税〔2019〕45号调整门槛）。
#
# ⚠️ 比例与资格是两个维度，别合成一个：
#   第三条 是**资格**——个人（上年度月均收入门槛）、企业（上年度应纳税所得额门槛）、
#              事业单位/社会团体/非营利性科研机构（无金额门槛）。
#   第四条 是**比例**——「专利申请人或者专利权人为个人或者单位的，减缴 85%」；
#              「两个或者两个以上的个人或者单位为共同专利申请人或者共有专利权人的，减缴 70%」。
#   比例只取决于申请人/专利权人是**一个还是多个**，与主体是个人还是企业无关。
#   官方收费标准的费减栏也是这么印的：两列标题就是「85%」「70%」，与资格行正交。
#
# 减缴种类：申请费（不包括公布印刷费、申请附加费）、发明专利申请实质审查费、复审费、
#           年费（自授予专利权当年起十年内的年费，专利开放实施许可期间的年费）。
reductionPercent:
  single: 85
  joint: 70
reductionKinds:
  - kind: individual
    label: 个人
    eligibility: 上年度月均收入低于 5000 元（年 6 万元）的个人；请求时应提交所在单位出具的年度收入证明（无固定工作的按第七条规定提交经济困难证明）。
  - kind: enterprise
    label: 企业
    eligibility: 上年度企业应纳税所得额低于 100 万元的企业；请求时应提交上年度企业所得税年度纳税申报表复印件（汇算清缴期内提交上上年度）。
  - kind: institution
    label: 事业单位、社会团体、非营利性科研机构
    eligibility: 无收入或所得额门槛；请求时应提交法人证明材料复印件。
reductionTiming: 请求减缴**申请费**的，应当在提出专利申请的同时提出；请求减缴其他费用的，可以与专利申请同时提出，也可以在相关费用缴纳期限届满日两个半月之前提出。未按规定时限提交减缴请求的，不予减缴（《专利收费减缴办法》第五条）。
reductionNote: 减缴经国家知识产权局批准（备案）后，按批准后的应缴数额缴纳；申请人/专利权人发生变更的，变更后的权利人应重新提交减缴请求（《专利收费减缴办法》第八条、第十条）。对专利开放许可实施期间的专利年费另减免 15%，同时符合两项年费减缴条件的按其中比例较高的一项减缴，不得重复享受（财税〔2024〕23号第二条）。

