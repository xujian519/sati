# 中国法定节假日与调休上班日（专利期限届满日顺延用）。
#
# 依据：专利法实施细则第五条末句——「期限届满日是法定休假日的，以休假日后的第一个工作日为
# 期限届满日」；《专利审查指南》第五部分第七章把「移用周休息日」一并纳入。故本文件同时记录
# 两类日期：放假（非工作日）与调休上班（原本是周休息日但上班）。
#
# ⚠️ 维护纪律（三条，缺一条就会静默给出错误的届满日）
#
# 1. **覆盖年份之外一律 fail-loud**：没有该年份的官方安排，就无法判断届满日是否需要顺延。
#    运行时不得按「不是休假日」处理（`work-calendar.ts` 抛 WorkCalendarCoverageError）。
# 2. **新增年份必须附通知文号与核验日期**：`source` 写国务院办公厅通知的文号，
#    `verifiedOn` 写你**逐条对照官方通知**的日期。两者缺一即装载失败——抄错的节假日等于
#    给出一批错误的届满日，而使用者看不出来。
# 3. **当年必须有数据**：`assertCalendarFreshness` 以此为准。次年安排按惯例于每年 11 月发布
#    （实测：2025 年安排 2024-11-12 发布，2026 年安排 2025-11-04 发布），故门禁给到当年
#    12 月 1 日为止；到该日仍未补次年数据即 CI 红。
#
# 本轮核验（2026-10-15）：2025、2026 两年逐条对照中国政府网通知原文，含全部调休上班日。
