version: "1.0"
rules:
  - id: CON-COMP-0101
    name: 禁止编造占位专利号
    domain: patent_general
    phase: post_execution
    severity: critical
    action: block
    check:
      type: keyword_blocklist
      keywords:
        - CNXXXXXX
        - CNxxxxxx
        - (20XX)
        - (20xx)
        - USXXXXXXX
        - WO20XX/
