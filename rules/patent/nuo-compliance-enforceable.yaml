    name: 禁止编造审查指南内容
    domain: patent_general
    phase: post_execution
    severity: critical
    action: block
    check:
      type: structural_analysis
      requiresAll:
        - element: 期望模式
          description: 禁止编造审查指南内容
          patterns:
            - 审查指南
      minConfidence: 1
