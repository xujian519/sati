# 基础规则包 — 创造性论证规则（来源：《创造性判断规则方法与典型案例》画布 §2 三步法 / §5.1 案例一）
# 准入标准：跨领域方法论级（不涉特定技术领域的实体判断）。

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 三步法论证结构完整性（画布 §2 + §6.1 工作流）
  # 创造性论证须含"最接近现有技术 / 区别特征 / 技术启示"三要素。
  # 语境锚点（创造性上下文）+ 三要素，minConfidence 0.75：
  #   缺锚点的文本最多命中 3/4 = 0.75 不违规（避免对非创造性文本误报）；
  #   有锚点且缺两个以上要素 → 违规（warn）。
  # ---------------------------------------------------------------------------
  inventiveness_three_step_structure:
    id: INV-METHOD-001
    name: 创造性论证三步法结构完整性
    description: 创造性论证须包含最接近现有技术、区别特征、技术启示三要素
    phase: 论证
    severity: minor
    action: warn
    legalBasis: 专利审查指南第二部分第四章 §3.2.1.1（三步法）
    check:
      type: structural_analysis
      requiresAll:
        - element: 创造性论证语境
          description: 文本处于创造性/非显而易见性论证上下文（语境锚点）
          patterns:
            - 创造性
            - 显而易见
            - 突出的实质性特点
            - 非显而易见
        - element: 最接近的现有技术
          description: 应指明最接近的现有技术
          patterns:
            - 最接近的现有技术
            - 最接近现有技术
            - 最接近的对比文件
        - element: 区别技术特征
          description: 应确定区别技术特征与实际解决的技术问题
          patterns:
            - 区别特征
            - 区别技术特征
            - 差异特征
        - element: 技术启示判断
          description: 应判断是否存在技术启示
          patterns:
            - 技术启示
            - 结合启示
            - 改进动机
            - 公知常识
      minConfidence: 0.75

  # ---------------------------------------------------------------------------
  # "容易想到"类断言须有证据支持（画布 §5.1 案例一 (2025)最高法知行终959号）
  # 认定区别特征"容易想到/易于获得"而无公知常识性证据的，实难令人信服。
  # 确定性引擎无法核验证据有无 → 命中即挂 review（人工核验证据）。
  # 否定语境豁免依共享否定词表（text-utils.DEFAULT_NEGATION_WORDS，保守取向）。
  # ---------------------------------------------------------------------------
  inventiveness_obviousness_evidence:
    id: INV-EVIDENCE-001
    name: 显而易见性断言须有证据支持
    description: 主张区别特征"容易想到/显而易见/易于获得"须有公知常识性证据支持，命中挂人工核验
    phase: 论证
    severity: major
    action: review
    legalBasis: (2025)最高法知行终959号：无公知常识性证据支持认定"容易想到""易于获得"，实难令人信服
    check:
      type: keyword_blocklist
      negationContext: true
      keywords:
        - "容易想到"
        - "易于获得"
        - "显而易见"
