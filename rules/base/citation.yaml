# 基础规则包 — 法条引用范围检查（画布 §2 法条框架）
# 创造性判断核心法源为专利法第22条第3款；引用条号不得超出有效范围。

version: "1.0"

rules:
  # ---------------------------------------------------------------------------
  # 法条引用范围核验：条号不得超出《专利法》（2020 修正，82 条）有效范围。
  # 《实施细则》条号在 2001/2010/2023 三版间漂移，不做存在性核验
  # （同 rules/patent/compliance.yaml PAT-CITE-001 的既定决策）。
  # ---------------------------------------------------------------------------
  base_citation_range:
    id: BASE-CITE-001
    name: 法条引用范围核验
    description: 专利法条引用不得超出 2020 修正版有效条号范围（含 §22.3 创造性框架）
    phase: 输出
    severity: major
    action: warn
    legalBasis: 引用核验 R1：条号不得超出《专利法》（2020 修正，共 82 条）
    check:
      type: citation_analysis
      statutes:
        专利法:
          max: 82
