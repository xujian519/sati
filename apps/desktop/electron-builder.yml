appId: cc.sati.desktop
productName: Sati
copyright: "Copyright © 2026 徐健  xujian519@gmail.com. AGPL-3.0-or-later."

directories:
  output: dist-electron
  buildResources: resources

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: arm64
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  minimumSystemVersion: "12.0"
  darkModeSupport: true
  # Without these *UsageDescription strings, macOS TCC popups appear with an
  # empty body — users see a generic "Sati 想要访问 ..." prompt and have
  # no idea why, which is half of the "陆陆续续蹦出来权限请求窗口" complaint.
  # Each string is what shows up in the system dialog AND in
  # System Settings → Privacy & Security → <category> → Sati.
  extendInfo:
    NSDocumentsFolderUsageDescription: >-
      Sati 需要访问"文稿"目录以便加载和保存你授权的 workspace 项目内容。
    NSDownloadsFolderUsageDescription: >-
      Sati 需要访问"下载"目录以便处理你拖入对话窗口的附件。
    NSDesktopFolderUsageDescription: >-
      Sati 需要访问"桌面"目录以便加载放在桌面上的 workspace 项目内容。
    NSRemovableVolumesUsageDescription: >-
      Sati 需要访问可移除磁盘上的 workspace 项目内容。
    NSAppleEventsUsageDescription: >-
      Sati 在使用浏览器自动化技能时需要控制 Google Chrome / Chromium 实例。
    NSCameraUsageDescription: >-
      Sati 不主动使用摄像头；当用户授权的 plugin/MCP 调用涉及摄像头时才会请求。
    NSMicrophoneUsageDescription: >-
      Sati 不主动使用麦克风；当用户授权的 plugin/MCP 调用涉及麦克风时才会请求。

dmg:
  sign: true
  artifactName: "Sati-${version}-arm64.dmg"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  # arch deliberately NOT listed here: with a multi-arch list, electron-builder
  # v26 ignores the CLI --x64/--arm64 flag (it merges it into the config list)
  # and emits THREE installers per build: the combined archs=x64+arm64
  # "Sati-<v>-win.exe" (~600MB, the historical 830MB-junk mechanism) plus one
  # per-arch exe. build-win.bat always passes --x64/--arm64, so the CLI flag is
  # the single source of truth and each run produces exactly one installer.
  target:
    - target: nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "Sati-${version}-win-${arch}.exe"
  shortcutName: Sati
  uninstallDisplayName: Sati ${version}

afterSign: scripts/notarize.js

extraResources:
  - from: resources/node-bin/
    to: node-bin/
  - from: resources/bun-bin/
    to: bun-bin/
  - from: resources/satiui-bundle.tar
    to: satiui-bundle.tar
  - from: resources/sati-main-bundle.tar
    to: sati-main-bundle.tar
  - from: resources/sati-memory-core-bundle.tar
    to: sati-memory-core-bundle.tar
  # Windows 托盘/窗口图标：Tray 与 BrowserWindow 需要从磁盘加载图标文件，
  # 而 electron-builder 只把 .ico 编进 exe 资源，不会放进 resourcesPath ——
  # 不单独打包的话打包后 resolveAppIconPath() 找不到图标。
  - from: resources/icon.ico
    to: icon.ico

files:
  - "dist/**/*"
  - "onboarding/**/*"
  - "splash/**/*"
  # Only the runtime dep (yaml) goes into the asar. The full "node_modules/**/*"
  # glob would drag every devDependency (electron itself, electron-builder,
  # typescript, …) into the package, wasting ~200MB and shipping macOS .app
  # bundles that resist recursive deletion (ENOTEMPTY at startup).
  - "node_modules/yaml/**/*"
  - "package.json"
